---
argument_specs:
  main:
    short_description: install gomplate
    options:
      gomplate_version:
        description:
          - Latest stable release, or an exact SemVer without a leading v.
          - Exact versions permit downgrades; latest only upgrades.
        type: str
        default: latest
      gomplate_checksum:
        description:
          - Optional 64-character hexadecimal SHA-256 checksum for the selected binary.
          - Takes precedence over embedded checksums and upstream release metadata.
        type: str
        default: ""
      gomplate_checksums:
        description:
          - Embedded SHA-256 checksums keyed by exact version, then amd64 or arm64.
        type: dict
        default:
          "5.2.0":
            amd64: a235564c12f12e755c06e3ab2af414ab1e3f5b1f142eb82ea2d8086145670a81
            arm64: f445888455c30fa80a3ddce1643baadcdbe1a0207eb6c0de300a38a2c3fb64a2
