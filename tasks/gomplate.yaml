---
- name: validate gomplate inputs
  ansible.builtin.assert:
    that:
      - gomplate_version is string
      - gomplate_version == 'latest' or gomplate_version is match('^' ~ gomplate_semver_pattern ~ '$')
      - gomplate_checksum is string
      - gomplate_checksum == '' or gomplate_checksum is match('^[0-9a-fA-F]{64}$')
      - gomplate_checksums is mapping
      - ansible_facts['architecture'] in gomplate_architecture_map
    fail_msg: >-
      Set gomplate_version to latest or an exact SemVer without a v prefix,
      and gomplate_checksum to an empty string or 64 hexadecimal SHA-256 characters.
      Only amd64 and arm64 architectures are supported.
    quiet: true

- name: retrieve the latest gomplate release
  ansible.builtin.include_tasks: release.yaml
  when: gomplate_version == 'latest'

- name: resolve the gomplate version
  ansible.builtin.set_fact:
    gomplate_resolved_version: >-
      {{
        gomplate_release.json.tag_name[1:]
        if gomplate_version == 'latest'
        else gomplate_version
      }}

- name: inspect the gomplate binary
  ansible.builtin.stat:
    path: /opt/gomplate/bin/gomplate
    get_checksum: false
  register: gomplate_binary_stat

- name: read the installed gomplate version
  ansible.builtin.command:
    argv:
      - /opt/gomplate/bin/gomplate
      - --version
  register: gomplate_installed
  changed_when: false
  check_mode: false
  when: gomplate_binary_stat.stat.exists

- name: validate the installed gomplate version
  ansible.builtin.assert:
    that:
      - gomplate_installed.stdout is match('^gomplate version ' ~ gomplate_semver_pattern ~ '$')
    fail_msg: "Unrecognized gomplate version output: {{ gomplate_installed.stdout }}"
    quiet: true
  when: gomplate_binary_stat.stat.exists

- name: determine whether gomplate needs installation
  ansible.builtin.set_fact:
    gomplate_install_required: >-
      {{
        not gomplate_binary_stat.stat.exists
        or (
          gomplate_version == 'latest'
          and gomplate_installed.stdout.split()[-1]
              is ansible.builtin.version(gomplate_resolved_version, '<', version_type='semver')
        )
        or (
          gomplate_version != 'latest'
          and gomplate_installed.stdout.split()[-1] != gomplate_resolved_version
        )
      }}

- name: install the selected gomplate release
  ansible.builtin.include_tasks: install.yaml
  when: gomplate_install_required

- name: link gomplate
  ansible.builtin.file:
    src: /opt/gomplate/bin/gomplate
    dest: /usr/bin/gomplate
    mode: "0755"
    owner: root
    group: root
    state: link
  when: not ansible_check_mode or gomplate_binary_stat.stat.exists
