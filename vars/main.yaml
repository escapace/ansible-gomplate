---
# vars file for escapace.gomplate

gomplate_architecture_map:
  amd64: amd64
  x86_64: amd64
  aarch64: arm64
  64-bit: amd64

gomplate_architecture: "{{ gomplate_architecture_map[ansible_facts['architecture']] }}"
gomplate_binary: gomplate_linux-{{ gomplate_architecture }}

gomplate_url_binary: https://github.com/hairyhenderson/gomplate/releases/download/v{{ gomplate_version }}/{{ gomplate_binary }}
gomplate_checksum_manifest_url: https://github.com/hairyhenderson/gomplate/releases/download/v{{ gomplate_version }}/checksums-v{{ gomplate_version }}_sha256.txt
gomplate_embedded_checksum: >-
  {{
    gomplate_checksum
    if gomplate_checksum | length > 0
    else gomplate_checksums.get(gomplate_version, {}).get(gomplate_architecture, '')
  }}
